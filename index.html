<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">High Score: <span id="high-score">0</span></div>
                <div class="info">Score: <span id="score">0</span></div>
                <div class="info">Time: <span id="time">00:00</span></div>
            </div>

            <div class="board"></div>

            <!-- Mobile Controls -->
            <div class="mobile-controls">
                <button class="arrow-btn" data-dir="up">↑</button>

                <div class="horizontal-arrows">
                    <button class="arrow-btn" data-dir="left">←</button>
                    <button class="arrow-btn" data-dir="right">→</button>
                </div>

                <button class="arrow-btn" data-dir="down">↓</button>
            </div>
        </section>

        <!-- Game Modal -->
        <div class="modal">
            <div class="start-game">
                <h1>Welcome to the Snake Game</h1>
                <button class="btn btn-start">Start Game</button>
            </div>

            <div class="game-over">
                <h1>Game Over</h1>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>

    <script src="./script.js"></script>
</body>
</html>
